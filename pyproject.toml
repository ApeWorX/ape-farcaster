[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-farcaster"
description = "ape-farcaster is a Python SDK for the Farcaster Protocol"
readme = "README.md"
authors = [
    {name = "Andreessen Horowitz", email = "crypto-engineering@a16z.com"},
    {name = "ApeWorX LTD.", email = "admin@apeworx.io"},
]
maintainers = [
    {name = "ApeWorX LTD.", email = "admin@apeworx.io"},
]
license = "MIT"
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "eth-ape>=0.8",
    "python-dotenv >= 0.21,<1.1",
    "pydantic>=2.6.4,<3",
    "pyhumps >= 3.7.2",
    "requests >= 2.28.1",
    "canonicaljson >= 1.6.4,<3.0.0",
    "eth-account",
    "parsimonious >= 0.10.0,<0.11.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ApeWorX/ape-farcaster"

[dependency-groups]
docs = [
    "docconvert>=2.0.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=9.0.5",
    "mkdocstrings>=0.19.1,<0.24.0",
    "mkdocstrings-python>=0.8.3,<0.11.0",
    "cairosvg>=2.6.0",
]
test = [
    "pytest>=7.2.1",
    "pytest-xdist",
    "pytest-cov>=4.0.0",
    "pytest-dependency>=0.5.1",
    "pytest-html>=3.1.1",
    "pytest-recording>=0.12.1",
    "vcrpy>=5.1.0",
    "coverage>=7.2.1",
    "hypothesis>=6.2.0,<7",
]
lint = [
    "mypy>=1.15.0,<2",
    "types-setuptools",
    "types-requests>=2.31.0.2",
    "ruff>=0.9.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "commitlint",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
ape_farcaster = ["py.typed"]

[tool.setuptools_scm]
write_to = "ape_farcaster/version.py"

[tool.mypy]
exclude = "build/"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger (catches breakpoint/pdb)
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "TC003",  # Move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
"version.py" = ["ALL"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG001", "ARG002"]  # Pytest fixtures may appear unused

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """
    -p no:ape_test
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=ape_farcaster
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.mdformat]
number = true
